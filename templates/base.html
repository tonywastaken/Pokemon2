<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Pokemon Card Alerts{% endblock %}</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: #111827;
        --text: #e5e7eb;
        --muted: #9ca3af;
        --accent: #f59e0b;
        --accent-2: #f97316;
        --border: rgba(148, 163, 184, 0.35);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        background: linear-gradient(180deg, #020817 0%, #0f172a 100%);
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
      }

      .page {
        width: min(1100px, calc(100% - 32px));
        margin: 0 auto;
      }

      .hero { padding: 72px 0 48px; }

      .badge {
        display: inline-block;
        background: rgba(245, 158, 11, 0.12);
        color: #fbbf24;
        border: 1px solid rgba(245, 158, 11, 0.3);
        border-radius: 999px;
        padding: 8px 14px;
        font-size: 0.8rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      h1 {
        font-size: clamp(2.2rem, 6vw, 4rem);
        margin: 18px 0 16px;
        line-height: 1.1;
      }

      p { color: var(--muted); line-height: 1.6; }

      .layout {
        display: grid;
        grid-template-columns: 1.2fr 0.8fr;
        gap: 28px;
      }

      .panel {
        background: rgba(17, 24, 39, 0.8);
        border: 1px solid var(--border);
        border-radius: 18px;
        box-shadow: 0 20px 45px rgba(2, 6, 23, 0.4);
      }

      .panel-inner { padding: 24px; }

      form { display: grid; gap: 16px; }

      .grid-two {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }

      label {
        display: grid;
        gap: 8px;
        color: var(--text);
        font-weight: 600;
      }

      input, select, button { font: inherit; }

      input, select {
        width: 100%;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: rgba(15, 23, 42, 0.9);
        color: var(--text);
        padding: 12px 14px;
      }

      button {
        cursor: pointer;
        border: none;
        border-radius: 10px;
        background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
        color: #111827;
        font-weight: 800;
        padding: 14px 18px;
      }

      .list {
        margin: 0;
        padding-left: 18px;
        color: var(--muted);
        line-height: 1.8;
      }

      .thanks {
        min-height: 60vh;
        display: grid;
        place-items: center;
      }

      .success-box {
        max-width: 640px;
        padding: 40px 28px;
        text-align: center;
      }

      .flash {
        background: rgba(52, 211, 153, 0.14);
        color: #d1fae5;
        border: 1px solid rgba(52, 211, 153, 0.35);
        border-radius: 10px;
        padding: 12px 14px;
        margin-bottom: 16px;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 16px;
      }

      th, td {
        text-align: left;
        padding: 12px 10px;
        border-bottom: 1px solid var(--border);
        vertical-align: top;
      }

      th { color: #f8fafc; }

      @media (max-width: 840px) {
        .layout, .grid-two { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <div class="page">
      {% block content %}{% endblock %}
    </div>
  </body>
</html>
